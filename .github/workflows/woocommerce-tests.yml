            search.php single.php style.css styles.css pages.css home.css template-about.php \
            template-categories.php template-contact.php template-order-tracking.php template-stores.php \
            theme.json woocommerce.php WORDPRESS.md
          python3 tools/make-patch.py --version 2.2.11 --min-version 2.2.10 \
            --files style.css app/Providers/AdminServiceProvider.php app/Providers/DeliveryFeedbackServiceProvider.php app/View/Composers/CheckoutCartComposer.php app/View/Composers/SingleProductComposer.php config/app.php config/defaults.php resources/css/delivery-feedback.css resources/js/admin-panel.js resources/views/admin/settings.blade.php resources/views/woocommerce/delivery-feedback.php resources/views/woocommerce/single-product.blade.php \
