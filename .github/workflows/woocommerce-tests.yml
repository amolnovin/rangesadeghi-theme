          python3 - <<'PYVERIFY'
          import os, zipfile, json, hashlib, base64, subprocess
          base = os.path.join(os.environ['RUNNER_TEMP'], 'release')
          expected = {'style.css', 'app/Providers/AdminServiceProvider.php', 'app/Providers/DeliveryFeedbackServiceProvider.php', 'app/View/Composers/CheckoutCartComposer.php', 'app/View/Composers/SingleProductComposer.php', 'config/app.php', 'config/defaults.php', 'resources/css/delivery-feedback.css', 'resources/js/admin-panel.js', 'resources/views/admin/settings.blade.php', 'resources/views/woocommerce/delivery-feedback.php', 'resources/views/woocommerce/single-product.blade.php'}
          assert subprocess.check_output(['git', 'rev-parse', 'v2.2.10^{commit}'], text=True).strip() == 'e186d6a79c7c885b38f54fd0462d988f6b4495c5'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'v2.2.10', os.environ['GITHUB_SHA']], text=True).splitlines())
          with zipfile.ZipFile(os.path.join(base, 'rangesadeghi-wordpress-2.2.11.zip')) as full, zipfile.ZipFile(os.path.join(base, 'rangesadeghi-patch-2.2.11.zip')) as patch:
              deployed = {name[len('rangesadeghi/'):] for name in full.namelist() if name.startswith('rangesadeghi/') and not name.endswith('/')}
              assert changed & deployed == expected, (changed & deployed, expected)
