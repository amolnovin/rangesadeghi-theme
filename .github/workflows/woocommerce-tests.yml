      - name: Build and verify release packages
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          git archive --format=zip --prefix=rangesadeghi/ --output="$RUNNER_TEMP/release/rangesadeghi-wordpress-2.2.11.zip" "$GITHUB_SHA" -- \
