          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## قالب رنگ صادقی ۲.۲.۱۱ — بازخورد تحویل

          وضعیت «تحویل شده» مستقل از «تکمیل شده» است. در تنظیمات فروشگاه وضعیت ارسال موجود را انتخاب، اتصال افزونه ippanel-core و متن یا پترن را تنظیم و ارسال خودکار را فعال کنید. برای متن، متغیرهای {order_id} و {link} و برای پترن متغیرهای order_id و link لازم‌اند. ارسال اولیه ۷۲ ساعت پس از ورود به وضعیت ارسال است؛ پس از پاسخ خیر، یادآوری هر چهار روز تقویمی تکرار می‌شود. ارسال آزمایشی و دستی پیامک واقعی به شماره سفارش می‌فرستد. سفارش‌های از قبل ارسال‌شده به‌طور خودکار زمان‌بندی نمی‌شوند. برای زمان‌بندی قابل اتکا cron سرور برای WP-Cron تنظیم شود. خطای ارسال در یادداشت سفارش ثبت و روز بعد مجدداً تلاش می‌شود.

          لینک توکن‌دار به تنهایی مجوز ثبت بازخورد همان سفارش است؛ از انتشار آن خودداری شود. IPPanel Core ممکن است متن پیام و لینک را در گزارش پیامک ذخیره کند. تصاویر در کتابخانه رسانه معمول وردپرس ذخیره و از نشانی مستقیم عمومی قابل دسترسی هستند؛ نمایش تصاویر همراه نظر پس از تأیید نظر انجام می‌شود. برای سفارش چندمحصولی یک محصول جهت نظر انتخاب می‌شود. نظر اختیاری است و در صورت ثبت در انتظار تأیید مدیر خواهد بود.

          آزمون‌های WordPress/WooCommerce با و بدون HPOS انجام شده‌اند؛ ارسال واقعی و تنظیمات IPPanel سایت شما آزمایش نشده است. پیش از فعال‌سازی در محیط آزمایشی بررسی و پشتیبان تهیه کنید. وضعیت کیف پول همچنان مطابق هشدار نسخه ۲.۲.۱۰ است و در این نسخه اصلاح نشده است.

          فایل rangesadeghi-wordpress-2.2.11.zip نسخه کامل نصب قالب است؛ پچ ZIP و JSON مخصوص ارتقا از ۲.۲.۱۰ در نصب‌کننده پچ پنل قالب هستند و ZIP پچ فایل نصب پوسته نیست.
          NOTES
          gh release create v2.2.11 "$RUNNER_TEMP/release/rangesadeghi-wordpress-2.2.11.zip" "$RUNNER_TEMP/release/rangesadeghi-patch-2.2.11.zip" "$RUNNER_TEMP/release/rangesadeghi-patch-2.2.11.json" --target "$GITHUB_SHA" --title 'رنگ صادقی ۲.۲.۱۱' --notes-file "$RUNNER_TEMP/notes.md" --prerelease
