name: WooCommerce integration tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hpos: ['yes', 'no']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and smoke tests
        run: |
          set -euo pipefail
          find app bootstrap config woocommerce tests -name '*.php' -print0 | xargs -0 -n 1 php -l
          find . -maxdepth 1 -name '*.php' -print0 | xargs -0 -n 1 php -l
          php tests/smoke.php
          node --check resources/js/theme.js
          npm install --no-save --no-package-lock jsdom
          node tests/checkout-ui.cjs
      - name: Test with WordPress and WooCommerce
        env:
          HPOS_ENABLED: ${{ matrix.hpos }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/rs-integration.log") 2>&1
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$RUNNER_TEMP/wp-cli.phar"
          wp() { php "$RUNNER_TEMP/wp-cli.phar" "$@" --path="$RUNNER_TEMP/wp"; }
          mkdir -p "$RUNNER_TEMP/wp"
          wp core download --version=6.7.2
          wp config create --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          wp core install --url=http://example.test --title='Test' --admin_user=admin --admin_password=test-password --admin_email=admin@example.test --skip-email
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/wp/wp-content/themes/rangesadeghi"
          wp theme activate rangesadeghi
          wp plugin install woocommerce --version=9.6.2 --activate
          wp option update woocommerce_custom_orders_table_enabled "$HPOS_ENABLED"
          wp eval-file "$GITHUB_WORKSPACE/tests/woocommerce-integration.php"
      - name: Report integration errors
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/rs-integration.log"; then
            python3 - <<'PYERROR'
          import os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'rs-integration.log')
          text = open(p, errors='replace').read()[-4500:]
          print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYERROR
          fi

  publish-checkout-release:
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/1175adaa-rangesadeghi-theme'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify checkout release packages
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          git archive --format=zip --prefix=rangesadeghi/ --output="$RUNNER_TEMP/release/rangesadeghi-wordpress-2.2.2.zip" "$GITHUB_SHA" -- \
            app bootstrap config resources assets woocommerce 404.php archive.php comments.php footer.php \
            front-page.php functions.php header.php home.php index.php page.php rtl.css screenshot.png \
            search.php single.php style.css styles.css pages.css home.css template-about.php \
            template-categories.php template-contact.php template-order-tracking.php template-stores.php \
            theme.json woocommerce.php WORDPRESS.md
          python3 tools/make-patch.py --version 2.2.2 --min-version 2.2.1 \
            --files style.css app/Providers/WooCommerceServiceProvider.php resources/css/wp-compat.css resources/js/theme.js \
              woocommerce/checkout/form-checkout.php woocommerce/checkout/rs-progress.php woocommerce/checkout/rs-summary.php woocommerce/checkout/thankyou.php \
            --notes 'بهبود مراحل تسویه حساب ووکامرس' --out-dir "$RUNNER_TEMP/release"
          python3 - <<'PY'
          import os, zipfile, json, hashlib, base64, subprocess
          base = os.path.join(os.environ['RUNNER_TEMP'], 'release')
          expected = {'style.css', 'app/Providers/WooCommerceServiceProvider.php', 'resources/css/wp-compat.css', 'resources/js/theme.js', 'woocommerce/checkout/form-checkout.php', 'woocommerce/checkout/rs-progress.php', 'woocommerce/checkout/rs-summary.php', 'woocommerce/checkout/thankyou.php'}
          with zipfile.ZipFile(os.path.join(base, 'rangesadeghi-wordpress-2.2.2.zip')) as full, zipfile.ZipFile(os.path.join(base, 'rangesadeghi-patch-2.2.2.zip')) as patch:
              assert full.testzip() is None and patch.testzip() is None
              assert b'Version: 2.2.2' in full.read('rangesadeghi/style.css')
              manifest = json.loads(patch.read('patch.json'))
              bundle = json.load(open(os.path.join(base, 'rangesadeghi-patch-2.2.2.json')))
              assert manifest['min_version'] == '2.2.1' and manifest['target_version'] == '2.2.2'
              assert set(manifest['files']) == expected
              for name, meta in manifest['files'].items():
                  data = patch.read('files/' + name)
                  assert data == full.read('rangesadeghi/' + name) == subprocess.check_output(['git', 'show', os.environ['GITHUB_SHA'] + ':' + name])
                  assert hashlib.sha256(data).hexdigest() == meta['sha256']
                  assert data == base64.b64decode(bundle['files'][name]['content_base64'])
          PY
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## قالب رنگ صادقی ۲.۲.۲

          بازطراحی مراحل تسویه حساب کلاسیک ووکامرس با نمای نزدیک به قالب HTML، خلاصه سفارش به‌روز و نمایش نتیجه واقعی سفارش. روش‌های ارسال و پرداخت، اعتبارسنجی و ثبت سفارش همچنان توسط ووکامرس و افزونه‌های فعال انجام می‌شوند.

          فایل `rangesadeghi-wordpress-2.2.2.zip` نسخه کامل قابل نصب قالب است. فایل‌های `rangesadeghi-patch-2.2.2.zip` و `rangesadeghi-patch-2.2.2.json` پچ برای ارتقا از نسخه ۲.۲.۱ یا بالاتر هستند و ZIP پچ فایل نصب پوسته نیست. پیش از نصب، از سایت و پایگاه داده نسخه پشتیبان بگیرید و ابتدا در محیط آزمایشی با روش‌های ارسال و درگاه‌های سایت خود بررسی کنید.
          NOTES
          gh release create v2.2.2 "$RUNNER_TEMP/release/rangesadeghi-wordpress-2.2.2.zip" "$RUNNER_TEMP/release/rangesadeghi-patch-2.2.2.zip" "$RUNNER_TEMP/release/rangesadeghi-patch-2.2.2.json" --target "$GITHUB_SHA" --title 'رنگ صادقی ۲.۲.۲' --notes-file "$RUNNER_TEMP/notes.md" --prerelease

